[project]
id      = "gallery"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
abi  = "aapcs64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi  = "darwinpcs"

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"
default  = true

[profile.release]
optimize = true
debug    = false
simd     = "scalarize"

[artifact.gallery]
kind    = "bin"
default = true
entry   = "bin/main.mach"
out     = "{project.work}/bin/gallery{artifact.suffix}"
targets = ["*"]
link    = []
need    = []

[dep.blit]
path = "../.."

# blit's own committed pins, so the demo builds against exactly the std and toml blit does
[dep.std]
path = "../../dep/std"

[dep.toml]
path = "../../dep/toml"
