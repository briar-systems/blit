[project]
id      = "blit"
version = "0.2.1"
src     = "src"
out     = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa     = "x86_64"
os      = "linux"
abi     = "sysv64"
default = true

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
opt           = 0
debug         = true
simd          = "scalarize"
vectorize     = false
float_reassoc = false
default       = true

[profile.release]
opt           = 2
debug         = false
simd          = "scalarize"
vectorize     = true
float_reassoc = false

[artifact.blit]
kind    = "static"
default = true
entry   = "blit.mach"
out     = "lib/blit"
targets = ["*"]
link    = []
need    = []

[artifact.harness]
kind    = "bin"
entry   = "bin/harness.mach"
out     = "bin/blit"
targets = ["*"]
link    = []
need    = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v2.1.0"
