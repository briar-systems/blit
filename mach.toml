[project]
id      = "blit"
version = "0.13.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
abi  = "aapcs64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi  = "darwinpcs"

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"
default  = true

[profile.release]
optimize = true
debug    = false
simd     = "scalarize"

[artifact.blit]
kind    = "static"
default = true
export = true
entry   = "lib/blit.mach"
out     = "{project.work}/lib/libblit{artifact.suffix}"
targets = ["*"]
link    = []
need    = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.toml]
git = "https://github.com/briar-systems/mach-toml"
ref = "branch/dev"
